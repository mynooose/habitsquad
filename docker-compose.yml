version: '3.8'

services:
  backend:
    build: ./backend
    container_name: habitsquad-api
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      - migrate

  migrate:
    build: ./backend
    container_name: habitsquad-migrate
    restart: "no"
    env_file:
      - ./backend/.env
    command: npx prisma db push

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    container_name: habitsquad-web
    restart: always
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: habitsquad-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
